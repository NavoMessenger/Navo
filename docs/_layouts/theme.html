<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · {{ site.title }}</title>
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/theme-open.css' | relative_url }}">
  <meta name="theme-color" content="#2D7FF9">
  <meta name="robots" content="noindex">
  <meta property="og:site_name" content="Navo">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ '/images/banner.png' | absolute_url }}">
  <link rel="icon" href="{{ '/images/banner.png' | relative_url }}" type="image/png">
</head>
<body class="theme-open">
  {{ content }}
  <script src="{{ '/assets/js/theme-open.js' | relative_url }}" defer></script>
</body>
</html>
