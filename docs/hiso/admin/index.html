<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Navo 资源广场 · 运营后台</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg:#0f1117; --card:#181c27; --line:#262b3a; --txt:#e8eaf0; --sub:#9aa3b5;
      --brand:#3b82f6; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font:14px/1.5 -apple-system, "PingFang SC", "Segoe UI", sans-serif; background:var(--bg); color:var(--txt); }
    .wrap { max-width:1080px; margin:0 auto; padding:24px 16px 80px; }
    h1 { font-size:20px; margin-bottom:4px; }
    .sub { color:var(--sub); margin-bottom:20px; }
    header { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
    nav { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
    nav button { background:var(--card); color:var(--sub); border:1px solid var(--line); border-radius:10px;
      padding:9px 16px; cursor:pointer; font-size:13px; }
    nav button.active { color:var(--brand); border-color:var(--brand); }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--sub); font-weight:600; }
    input, textarea, select { width:100%; background:#10141d; color:var(--txt); border:1px solid var(--line);
      border-radius:8px; padding:8px 10px; font-size:13px; margin:4px 0 10px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    button.primary { background:var(--brand); color:#fff; border:0; border-radius:9px; padding:8px 14px; cursor:pointer; }
    button.ok { background:var(--ok); color:#04120a; }
    button.warn { background:var(--warn); color:#201503; }
    button.ghost { background:transparent; color:var(--sub); border:1px solid var(--line); border-radius:9px; padding:8px 14px; cursor:pointer; }
    .badge { display:inline-block; border-radius:999px; padding:2px 9px; font-size:11px; font-weight:600; }
    .badge.pending { background:#3b3a2a; color:var(--warn); }
    .badge.approved { background:#17361f; color:var(--ok); }
    .badge.rejected, .badge.removed { background:#3a1f1f; color:var(--err); }
    .badge.regular { background:#232839; color:var(--sub); }
    .badge.premium { background:#2b2a3f; color:#a78bfa; }
    .badge.featured { background:#2f2a1d; color:var(--warn); }
    .muted { color:var(--sub); font-size:12px; }
    #login { max-width:360px; margin:12vh auto; }
    .hidden { display:none; }
    .toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:#232839;
      border:1px solid var(--line); border-radius:999px; padding:10px 18px; font-size:13px; z-index:9; }
  </style>
</head>
<body>
  <div class="wrap">
    <section id="login" class="hidden">
      <h1>Navo 运营后台</h1>
      <p class="sub">管理员登录</p>
      <div class="card">
        <input id="email" type="email" placeholder="邮箱" autocomplete="username" />
        <input id="password" type="password" placeholder="密码" autocomplete="current-password" />
        <button class="primary" style="width:100%" onclick="login()">登录</button>
      </div>
    </section>

    <section id="app" class="hidden">
      <header>
        <div>
          <h1>Navo 资源广场 · 运营后台</h1>
          <div class="sub" id="who"></div>
        </div>
        <button class="ghost" onclick="logout()">退出</button>
      </header>
      <nav>
        <button data-tab="review" class="active" onclick="tab('review')">审核队列</button>
        <button data-tab="catalog" onclick="tab('catalog')">目录</button>
        <button data-tab="metrics" onclick="tab('metrics')">数据看板</button>
        <button data-tab="risk" onclick="tab('risk')">风控</button>
      </nav>

      <div id="tab-review">
        <div class="card row">
          <input id="reviewNote" placeholder="审核备注（可选）" style="flex:1" />
          <button class="primary" onclick="loadSubmissions()">刷新</button>
          <button class="ok" onclick="batchReview('approved')">批量通过选中</button>
        </div>
        <div id="reviewList"></div>
      </div>

      <div id="tab-catalog" class="hidden">
        <div class="card">
          <h3 style="margin:0 0 8px">采集导入（crawler）</h3>
          <input id="crawlerSource" placeholder="数据源 JSON URL（留空则用 app_config.crawler_source）" />
          <textarea id="crawlerItems" rows="3" placeholder="或直接粘贴 JSON 数组，如 [{&quot;username&quot;:&quot;x&quot;,&quot;title&quot;:&quot;X&quot;,&quot;category&quot;:&quot;tech&quot;}]"></textarea>
          <div class="row">
            <button class="primary" onclick="runCrawler()">运行采集</button>
            <button class="ghost" onclick="loadCrawlerStatus()">查看状态</button>
            <span class="muted" id="crawlerStatus"></span>
          </div>
          <p class="muted" style="margin-top:6px">
            通用源字段：username/title/kind/category/description/language/tags/popularity/invite_link。按 slug 幂等覆盖。
          </p>
        </div>
        <div class="card row">
          <button class="primary" onclick="loadCatalog()">刷新</button>
          <button class="ok" onclick="batchEdit({'status':'listed'})">批量上架</button>
          <button class="warn" onclick="batchEdit({'status':'hidden'})">批量隐藏</button>
          <button class="ghost" onclick="batchEdit({'recommended':true})">推荐✓</button>
          <button class="ghost" onclick="batchEdit({'recommended':false})">取消推荐</button>
          <select id="catSelect" style="width:auto;margin:0">
            <option value="">批量设分类…</option>
          </select>
        </div>
        <div class="card">
          <textarea id="bulkImport" rows="3" placeholder='批量导入 JSON 数组，如 [{"slug":"x","title":"X","username":"x","category":"tech"}]'></textarea>
          <div class="row">
            <button class="primary" onclick="bulkImport()">导入/更新</button>
            <span class="muted">按 slug 覆盖，支持 kind/description/language/tags/recommended/popularity</span>
          </div>
        </div>
        <div id="catalogList"></div>
      </div>

      <div id="tab-metrics" class="hidden">
        <div class="card row">
          <button class="primary" onclick="loadLeaderboard()">刷新榜单</button>
          <button class="ok" onclick="loadOwnerOverview()">群主收益总览</button>
        </div>
        <div id="leaderboardList"></div>
        <div id="ownerOverviewList"></div>
      </div>

      <div id="tab-risk" class="hidden">
        <div class="card row">
          <button class="primary" onclick="runAudit()">运行扫描</button>
          <button class="ghost" onclick="loadRisk()">刷新</button>
          <span class="muted">异常设备会自动打标（flagged），上报上限收紧；suspended 直接拒绝。</span>
        </div>
        <div class="card">
          <h3 style="margin:0 0 8px">设备</h3>
          <div id="deviceList"></div>
        </div>
        <div class="card">
          <h3 style="margin:0 0 8px">审计记录</h3>
          <div id="auditList"></div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const SUPABASE_URL = window.SUPABASE_URL || "https://jvqrqmbinwzdbxvyrvlz.supabase.co";
    const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || "sb_publishable__VX5h9iIUbmuCu1LhST41w_eSfT-0tt";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
    let currentUser = null;
    const selected = new Set();

    function toast(msg) {
      const t = document.createElement("div");
      t.className = "toast"; t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2200);
    }

    async function ensureAdmin() {
      const { data: { user } } = await client.auth.getUser();
      if (!user) return false;
      const { data, error } = await client.from("profiles").select("role, username").eq("id", user.id).maybeSingle();
      if (error) { toast("权限校验失败：" + error.message); return false; }
      if (!data || data.role !== "admin") return false;
      currentUser = { ...user, ...data };
      return true;
    }

    async function boot() {
      if (await ensureAdmin()) {
        $("login").classList.add("hidden");
        $("app").classList.remove("hidden");
        $("who").textContent = `${esc(currentUser.username || "admin")} · ${currentUser.email}`;
        tab("review");
      } else {
        $("login").classList.remove("hidden");
        $("app").classList.add("hidden");
      }
    }

    async function login() {
      const { error } = await client.auth.signInWithPassword({
        email: $("email").value.trim(),
        password: $("password").value,
      });
      if (error) { toast(error.message); return; }
      if (!(await ensureAdmin())) { await client.auth.signOut(); toast("该邮箱不是管理员账号，或未获得后台权限"); return; }
      boot();
    }

    async function logout() { await client.auth.signOut(); boot(); }

    function tab(name) {
      document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b.dataset.tab === name));
      ["review", "catalog", "metrics", "risk"].forEach((t) => $("tab-" + t).classList.toggle("hidden", t !== name));
      if (name === "review") loadSubmissions();
      if (name === "catalog") loadCatalog();
      if (name === "metrics") loadLeaderboard();
      if (name === "risk") loadRisk();
    }

    async function runCrawler() {
      const { data: sess } = await client.auth.getSession();
      const token = sess?.session?.access_token;
      if (!token) { toast("登录状态失效"); return; }
      const sourceUrl = $("crawlerSource").value.trim();
      let items;
      const raw = $("crawlerItems").value.trim();
      if (raw) {
        try { items = JSON.parse(raw); } catch (_) { toast("JSON 解析失败"); return; }
        if (!Array.isArray(items)) { toast("items 必须是数组"); return; }
      }
      const payload = { ...(sourceUrl ? { source_url: sourceUrl } : {}), ...(items ? { items } : {}) };
      $("crawlerStatus").textContent = "采集中…";
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/crawler/import`, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify(payload),
        });
        const body = await res.json();
        if (!res.ok || body.ok !== true) { toast("采集失败：" + (body.error || res.status)); $("crawlerStatus").textContent = ""; return; }
        $("crawlerStatus").textContent = `导入 ${body.imported} · 更新 ${body.updated} · 共 ${body.total} 条`;
        toast(`采集完成：新增 ${body.imported}，更新 ${body.updated}`);
        $("crawlerItems").value = "";
        loadCatalog();
      } catch (e) {
        toast("采集失败：" + e.message);
        $("crawlerStatus").textContent = "";
      }
    }

    async function loadCrawlerStatus() {
      const { data: sess } = await client.auth.getSession();
      const token = sess?.session?.access_token;
      if (!token) { toast("登录状态失效"); return; }
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/crawler/status`, {
          headers: { Authorization: "Bearer " + token },
        });
        const body = await res.json();
        const last = body.last ? `上次：${body.last.imported} 新增 / ${body.last.updated} 更新（${body.last.at}）` : "尚未采集";
        $("crawlerStatus").textContent = `数据源：${body.source || "未配置"} · ${last}`;
      } catch (e) {
        toast("获取状态失败：" + e.message);
      }
    }

    async function loadSubmissions() {
      const { data, error } = await client.from("submissions")
        .select("id, title, username, description, status, review_note, kind, category:categories(slug), created_at")
        .order("created_at", { ascending: false });
      if (error) { toast(error.message); return; }
      const kindLabel = (k) => k === "channel" ? "频道" : k === "bot" ? "机器人" : "群组";
      $("reviewList").innerHTML = (data || []).map((s) => `
        <div class="card">
          <div class="row">
            <input type="checkbox" ${selected.has("s" + s.id) ? "checked" : ""} onchange="toggleSel('s${s.id}')" style="width:auto;margin:0" />
            <strong style="flex:1">${esc(s.title)} <span class="muted">@${esc(s.username || "-")}</span></strong>
            <span class="badge ${esc(s.status)}">${esc(s.status)}</span>
          </div>
          <p class="muted" style="margin:6px 0">${esc(s.description || "无简介")}</p>
          <p class="muted">类型：${kindLabel(s.kind)} · 分类：${esc(s.category?.slug || "-")} · ${esc(s.created_at || "")}</p>
          ${s.status === "pending" ? `
          <div class="row" style="margin-top:10px">
            <button class="ok" onclick="review(${s.id},'approved')">通过并上架</button>
            <button class="warn" onclick="review(${s.id},'rejected')">驳回</button>
          </div>` : `<p class="muted">备注：${esc(s.review_note || "—")}</p>`}
        </div>`).join("") || '<div class="card muted">暂无申请</div>';
    }

    function toggleSel(key) {
      if (selected.has(key)) selected.delete(key); else selected.add(key);
    }

    async function batchReview(status) {
      const ids = [...selected].filter((k) => k.startsWith("s")).map((k) => Number(k.slice(1)));
      if (!ids.length) { toast("请先勾选"); return; }
      const note = $("reviewNote").value.trim();
      const { error } = await client.rpc("batch_review_submissions", {
        p_ids: ids, p_status: status, p_note: note || null,
      });
      if (error) { toast(error.message); return; }
      ids.forEach((id) => selected.delete("s" + id));
      toast("已处理 " + ids.length + " 条");
      loadSubmissions();
    }

    async function review(id, status) {
      const note = $("reviewNote").value.trim();
      const { error } = await client.rpc("review_submission", {
        p_submission_id: id, p_status: status, p_note: note || null,
      });
      if (error) { toast(error.message); return; }
      toast(status === "approved" ? "已上架" : "已驳回");
      loadSubmissions();
    }

    async function loadCatalog() {
      const { data, error } = await client.rpc("admin_list_entries");
      if (error) { toast(error.message); return; }
      const entries = Array.isArray(data) ? data : [];
      const catSel = $("catSelect");
      const cats = (await client.from("categories").select("slug")).data || [];
      catSel.innerHTML = '<option value="">批量设分类…</option>' + cats.map((c) =>
        `<option value="${esc(c.slug)}">${esc(c.slug)}</option>`).join("");
      $("catalogList").innerHTML = `
        <div class="card row"><strong>共 ${entries.length} 条</strong></div>
        <table><thead><tr><th></th><th>标题</th><th>用户名</th><th>分类</th><th>徽章</th><th>得分</th><th>状态</th></tr></thead>
        <tbody>${entries.map((e) => `
          <tr>
            <td><input type="checkbox" ${selected.has("e" + e.db_id) ? "checked" : ""} onchange="toggleSel('e${e.db_id}')" style="width:auto;margin:0" /></td>
            <td>${esc(e.title)}</td><td>@${esc(e.username)}</td><td>${esc(e.category || "-")}</td>
            <td>${e.recommended ? '<span class="badge featured">推荐</span>' : ""}</td>
            <td>${esc(e.score)}</td><td>${esc(e.status)}</td>
          </tr>`).join("")}</tbody></table>`;
    }

    async function batchEdit(fields) {
      const ids = [...selected].filter((k) => k.startsWith("e")).map((k) => Number(k.slice(1)));
      if (!ids.length) { toast("请先勾选"); return; }
      const payload = { ...fields };
      if ($("catSelect") && $("catSelect").value && !fields.status) {
        payload.category = $("catSelect").value;
      }
      const { error } = await client.rpc("batch_update_entries", {
        p_ids: ids, p_fields: payload,
      });
      if (error) { toast(error.message); return; }
      ids.forEach((id) => selected.delete("e" + id));
      toast("已更新 " + ids.length + " 条");
      loadCatalog();
    }

    async function bulkImport() {
      let items;
      try { items = JSON.parse($("bulkImport").value); } catch (_) { toast("JSON 解析失败"); return; }
      if (!Array.isArray(items) || !items.length) { toast("请输入 JSON 数组"); return; }
      const { data, error } = await client.rpc("bulk_import_entries", { p_items: items });
      if (error) { toast(error.message); return; }
      toast(`导入 ${data?.imported ?? 0} · 更新 ${data?.updated ?? 0}`);
      $("bulkImport").value = "";
      loadCatalog();
    }

    async function loadLeaderboard() {
      const { data, error } = await client.rpc("leaderboard", { p_limit: 50 });
      if (error) { toast(error.message); return; }
      $("leaderboardList").innerHTML = `
        <table><thead><tr><th>#</th><th>群</th><th>贡献分</th><th>加入</th></tr></thead>
        <tbody>${(data || []).map((e, i) => `
          <tr>
            <td>${i + 1}</td><td>${esc(e.title)} <span class="muted">@${esc(e.username)}</span></td>
            <td>${esc(e.score)}</td><td>${esc(e.joins)}</td>
          </tr>`).join("")}</tbody></table>` || '<div class="card muted">暂无数据</div>';
    }

    async function loadOwnerOverview() {
      const { data, error } = await client.rpc("admin_owner_overview");
      if (error) { toast(error.message); return; }
      const rows = Array.isArray(data) ? data : [];
      $("ownerOverviewList").innerHTML = rows.length
        ? `<div class="card"><h3 style="margin:0 0 8px">群主收益总览（30 天）</h3>
          <table><thead><tr><th>群主</th><th>提交</th><th>已收录</th><th>打开</th><th>浏览</th><th>加入</th><th>安装</th><th>得分</th></tr></thead>
          <tbody>${rows.map((o) => `
            <tr>
              <td>${esc(o.display_name || o.username || ("#" + o.tg_user_id))}</td>
              <td>${esc(o.submission_count)}</td><td>${esc(o.listed_count)}</td>
              <td>${esc(o.opens)}</td><td>${esc(o.views)}</td><td>${esc(o.joins)}</td>
              <td>${esc(o.installs)}</td><td>${esc(o.score)}</td>
            </tr>`).join("")}</tbody></table></div>`
        : '<div class="card muted">暂无群主提交</div>';
    }

    async function loadRisk() {
      const [devices, audit] = await Promise.all([
        client.rpc("admin_list_devices"),
        client.rpc("admin_list_audit", { p_limit: 200 }),
      ]);
      if (devices.error) { toast(devices.error.message); return; }
      const devs = devices.data || [];
      $("deviceList").innerHTML = devs.length
        ? `<table><thead><tr><th>设备</th><th>平台</th><th>状态</th><th>备注</th><th>首次/最近</th></tr></thead><tbody>${
            devs.map((d) => `
              <tr>
                <td class="muted">${esc((d.id || "").slice(0, 8))}…</td>
                <td>${esc(d.platform || "-")}</td>
                <td><span class="badge ${esc(d.status)}">${esc(d.status)}</span></td>
                <td>${esc(d.note || "-")}</td>
                <td class="muted">${esc((d.created_at || "").slice(0, 16))}<br/>${esc((d.last_seen_at || "").slice(0, 16))}</td>
              </tr>`).join("")
        }</tbody></table>` : '<div class="muted">暂无设备</div>';
      if (!audit.error) {
        const rows = audit.data || [];
        $("auditList").innerHTML = rows.length
          ? `<table><thead><tr><th>时间</th><th>设备</th><th>类型</th><th>详情</th></tr></thead><tbody>${
              rows.map((a) => `
                <tr>
                  <td class="muted">${esc((a.created_at || "").slice(0, 16))}</td>
                  <td class="muted">${esc((a.device_id || "").slice(0, 8))}…</td>
                  <td>${esc(a.kind)}</td>
                  <td>${esc(JSON.stringify(a.detail || {}))}</td>
                </tr>`).join("")
          }</tbody></table>` : '<div class="muted">暂无审计记录</div>';
      }
    }

    async function runAudit() {
      const { data, error } = await client.rpc("run_audit");
      if (error) { toast(error.message); return; }
      toast("扫描完成：标记 " + (data?.flagged ?? 0) + " 台设备");
      loadRisk();
    }

    boot();
  </script>
</body>
</html>
