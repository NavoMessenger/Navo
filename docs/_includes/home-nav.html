{% assign lang = page.lang | default: 'en' %}
<header class="home-nav">
  <div class="home-nav__inner">
    <a class="home-nav__brand" href="{% if lang == 'zh' %}{{ '/zh-CN/' | relative_url }}{% else %}{{ '/' | relative_url }}{% endif %}">Navo</a>
    <nav class="home-nav__links" aria-label="{% if lang == 'zh' %}主导航{% else %}Primary{% endif %}">
      {% if lang == 'zh' %}
      <a href="{{ '/zh-CN/download.html' | relative_url }}">下载</a>
      <a href="{{ '/zh-CN/support.html' | relative_url }}"{% if page.url == '/zh-CN/support.html' %} aria-current="page"{% endif %}>支持</a>
      <a class="home-nav__desktop-link" href="https://github.com/NavoMessenger/Navo" rel="noopener">GitHub</a>
      <a href="{% if page.url == '/zh-CN/support.html' %}{{ '/support.html' | relative_url }}{% else %}{{ '/' | relative_url }}{% endif %}">English</a>
      {% else %}
      <a href="{{ '/download.html' | relative_url }}">Download</a>
      <a href="{{ '/support.html' | relative_url }}"{% if page.url == '/support.html' %} aria-current="page"{% endif %}>Support</a>
      <a class="home-nav__desktop-link" href="https://github.com/NavoMessenger/Navo" rel="noopener">GitHub</a>
      <a href="{% if page.url == '/support.html' %}{{ '/zh-CN/support.html' | relative_url }}{% else %}{{ '/zh-CN/' | relative_url }}{% endif %}">中文</a>
      {% endif %}
    </nav>
  </div>
</header>
